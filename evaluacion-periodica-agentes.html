<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisión de Ruta — Financiera Autocash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14213D;
    --asphalt:#3A3F44;
    --paper:#EEF1EF;
    --paper2:#E1E6E3;
    --teal:#1F7A6C;
    --teal-dark:#155A50;
    --green:#3FA34D;
    --red:#D6534A;
    --line:#CBD3CE;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      repeating-linear-gradient(90deg, transparent 0 78px, rgba(20,33,61,0.035) 78px 80px);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 60px;}

  .brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:6px;}
  .brand h1{font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin:0;color:var(--asphalt);}
  .brand .tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--teal-dark);background:#DCEFEA;padding:3px 8px;border-radius:3px;}

  .route{position:relative;padding:26px 6px 10px;margin-bottom:8px;}
  .route-line{position:absolute;top:38px;left:20px;right:20px;height:3px;background:repeating-linear-gradient(90deg,var(--asphalt) 0 10px, transparent 10px 18px);border-radius:2px;}
  .route-fill{position:absolute;top:38px;left:20px;height:3px;background:var(--teal);border-radius:2px;transition:width .5s ease;z-index:1;}
  .stops{position:relative;display:flex;justify-content:space-between;z-index:2;}
  .stop{width:26px;height:26px;border-radius:50%;background:var(--white);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--asphalt);transition:all .3s ease;}
  .stop.done{background:var(--teal);border-color:var(--teal-dark);color:var(--white);}
  .stop.active{border-color:var(--ink);color:var(--ink);transform:scale(1.15);}

  .card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:30px 28px;box-shadow:0 2px 0 var(--line);}
  .cat-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-dark);margin-bottom:10px;}
  .scenario-num{font-family:'Oswald',sans-serif;font-size:13px;color:var(--asphalt);opacity:.6;margin-bottom:4px;}
  .scenario-text{font-size:19px;line-height:1.5;margin:6px 0 26px;font-weight:500;color:var(--ink);}
  .scenario-text b{color:var(--ink);}

  .mini-track{position:relative;height:32px;margin:-8px 0 22px;}
  .mini-inner{position:absolute;top:0;left:0;right:28px;bottom:0;}
  .mini-line{position:absolute;top:50%;left:0;right:0;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 7px, transparent 7px 13px);transform:translateY(-50%);}
  .mini-car{position:absolute;top:50%;left:0%;transform:translate(-50%,-55%);transition:left .3s linear;width:30px;}
  .mini-car svg{width:30px;display:block;}
  .mini-flag{position:absolute;top:50%;right:-2px;transform:translateY(-50%);font-size:17px;}

  .goal-alert{background:#FBEAE8;border:1.5px solid var(--red);color:#A6362D;padding:9px 12px;border-radius:6px;font-size:13px;font-weight:600;margin:-10px 0 20px;animation:alertPop .35s ease;}
  @keyframes alertPop{ 0%{transform:scale(0.92);opacity:0;} 100%{transform:scale(1);opacity:1;} }

  @keyframes balloonUp{ 0%{transform:translateY(0) rotate(0deg); opacity:1;} 100%{transform:translateY(-115vh) rotate(12deg); opacity:0;} }

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    text-align:left;
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:14px 16px;
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
    transition:all .15s ease;
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .opt:hover{border-color:var(--ink);background:var(--white);transform:translateX(2px);}
  .opt .letter{font-family:'Oswald',sans-serif;font-weight:700;color:var(--teal-dark);flex-shrink:0;}

  .feedback{margin-top:20px;padding:16px 18px;border-radius:8px;font-size:14.5px;line-height:1.5;display:none;}
  .feedback.good{background:#E9F6EA;border:1.5px solid var(--green);color:#1F6B2C;}
  .feedback.mid{background:#EAF3F1;border:1.5px solid var(--teal-dark);color:#155A50;}
  .feedback.bad{background:#FBEAE8;border:1.5px solid var(--red);color:#A6362D;}
  .feedback strong{display:block;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}

  .continue-btn{margin-top:18px;background:var(--ink);color:var(--white);border:none;border-radius:6px;padding:12px 22px;font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;display:none;}
  .continue-btn:hover{background:#0C1730;}

  .start h2{font-family:'Oswald',sans-serif;font-size:30px;margin:0 0 10px;line-height:1.15;}
  .start p{font-size:15.5px;color:var(--asphalt);line-height:1.6;margin-bottom:20px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--asphalt);margin-bottom:5px;}
  .field input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:6px;font-family:'Inter';font-size:15px;background:var(--paper);}
  .field input:focus{outline:2px solid var(--ink);border-color:var(--ink);}
  .start-btn{margin-top:8px;width:100%;background:var(--teal);color:var(--white);border:none;border-radius:6px;padding:14px;font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;cursor:pointer;}
  .start-btn:hover{background:var(--teal-dark);}
  .start-btn:disabled{opacity:.45;cursor:not-allowed;}
  .prefill-note{background:#EAF3F1;border:1px solid var(--teal);color:#155A50;border-radius:6px;padding:9px 12px;font-size:13px;margin-bottom:16px;}

  .results h2{font-family:'Oswald',sans-serif;font-size:26px;margin:0 0 4px;}
  .results .sub{color:var(--asphalt);font-size:14px;margin-bottom:22px;}
  .verdict{padding:18px 20px;border-radius:8px;margin-bottom:26px;font-size:16px;line-height:1.5;}
  .verdict.v-good{background:#E9F6EA;border:1.5px solid var(--green);}
  .verdict.v-mid{background:#EAF3F1;border:1.5px solid var(--teal-dark);}
  .verdict.v-bad{background:#FBEAE8;border:1.5px solid var(--red);}
  .verdict strong{display:block;font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;}

  .bar-row{margin-bottom:16px;}
  .bar-top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px;}
  .bar-top .name{font-weight:600;}
  .bar-top .val{font-family:'JetBrains Mono',monospace;font-weight:700;}
  .bar-bg{height:14px;background:var(--paper2);border-radius:7px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:7px;transition:width .8s ease;}

  .reforzar{margin-top:26px;padding:16px 18px;background:var(--paper);border:1px dashed var(--asphalt);border-radius:8px;font-size:14px;color:var(--asphalt);}
  .reforzar b{color:var(--ink);}

  /* VALUATION SCENARIO */
  .val-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
  @media (max-width:640px){ .val-grid{grid-template-columns:1fr;} }
  .val-card{border:1.5px solid var(--line);border-radius:8px;padding:14px;background:var(--paper);}
  .val-photo{background:var(--white);border-radius:6px;overflow:hidden;margin-bottom:10px;border:1px solid var(--line);}
  .val-photo img{width:100%;display:block;}
  .val-fallback svg{width:100%;display:block;}
  .val-title{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;margin-bottom:6px;}
  .val-specs{display:flex;gap:12px;font-size:13px;color:var(--asphalt);margin-bottom:8px;}
  .val-cond{font-size:12.5px;color:var(--asphalt);line-height:1.5;margin-bottom:12px;min-height:52px;}
  .val-field{margin-bottom:8px;}
  .val-field label{display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--asphalt);margin-bottom:4px;}
  .val-field input{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:14px;background:var(--white);}
  .val-field input:focus{outline:2px solid var(--ink);border-color:var(--ink);}
  .val-field input:disabled{background:var(--paper2);color:var(--asphalt);}
  .val-choices{display:flex;gap:6px;flex-wrap:wrap;}
  .val-choice{flex:1;min-width:80px;padding:9px 6px;border:1.5px solid var(--line);border-radius:6px;background:var(--white);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);}
  .val-choice:hover{border-color:var(--ink);}
  .val-choice.selected{background:var(--ink);color:var(--white);border-color:var(--ink);}
  .val-choice:disabled{cursor:not-allowed;opacity:.6;}
  .val-computed{padding:9px 10px;background:var(--paper2);border:1.5px solid var(--line);border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--asphalt);}

  .timecard{display:flex;align-items:center;gap:16px;padding:16px 18px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:22px;background:var(--white);flex-wrap:wrap;}
  .timecard .big{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:700;color:var(--ink);line-height:1;}
  .timecard .meta{display:flex;flex-direction:column;gap:2px;}
  .timecard .label{font-family:'Oswald',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--asphalt);}
  .timecard .range{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--asphalt);opacity:.75;}
  .timecard .badge{margin-left:auto;padding:5px 12px;border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;white-space:nowrap;}
  .timecard .note{width:100%;font-size:12px;color:var(--asphalt);opacity:.75;font-style:italic;margin-top:2px;}

  .actions{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap;}
  .actions button{flex:1;min-width:150px;padding:12px;border-radius:6px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;border:1.5px solid var(--ink);background:var(--white);color:var(--ink);}
  .actions button.primary{background:var(--ink);color:var(--white);}
  .actions button:hover{opacity:.85;}

  @media print{
    body{background:white;}
    .route,.actions{display:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>Financiera Autocash</h1>
    <span class="tag" id="brandTag">Evaluación periódica de agentes</span>
  </div>

  <div class="route" id="routeHeader" style="display:none;">
    <div class="route-line"></div>
    <div class="route-fill" id="routeFill"></div>
    <div class="stops" id="stops"></div>
  </div>

  <div class="card" id="card"></div>
</div>

<script>
const CATEGORIES = {
  cierre:      { label: "Cierre y Documentación",           color: "#1F7A6C" },
  etica:       { label: "Ética y Cumplimiento",             color: "#3FA34D" },
  servicio:    { label: "Servicio al Cliente",              color: "#3A6EA5" },
  resultados:  { label: "Orientación a Resultados",         color: "#D6534A" },
  equipo:      { label: "Integridad y Trabajo en Equipo",   color: "#8A5AAB" },
  garantia:    { label: "Análisis de Garantía",             color: "#B8860B" },
};

const DEFAULT_SCENARIOS = [
  {
    cat: "cierre",
    text: 'Un cliente listo para firmar te dice que tiene otro compromiso en 20 minutos, pero notas que <b>le falta un documento en el expediente</b>.',
    order: [2,0,3,1],
    options: [
      { t: "Explicarle con calma qué falta y ofrecer agendar la firma en cuanto el expediente esté completo, aunque signifique no cerrar hoy.", pts:{etica:15,cierre:15}, fb:"good", fbText:"Correcto: no se compromete el expediente por cerrar rápido, y el cliente se va con un siguiente paso claro." },
      { t: "Dejarlo firmar y \"completar el documento después\".", pts:{etica:-25}, fb:"bad", fbText:"Un expediente incompleto expone a la empresa a un riesgo real de cumplimiento.", flag:true },
      { t: "Decirle que no se puede firmar hoy, sin ofrecer opción de agendar.", pts:{cierre:-10,servicio:-5}, fb:"mid", fbText:"Correcto en el fondo, pero perdiste la oportunidad de mantener el cierre en movimiento con una fecha concreta." },
      { t: "Completar tú mismo el documento faltante para no perder tiempo.", pts:{etica:-30}, fb:"bad", fbText:"Esto es alterar un expediente de forma indebida. Riesgo legal grave para ti y para la empresa.", flag:true },
    ],
  },
  {
    cat: "etica",
    text: 'Un cliente te pide que <b>ajustes el avalúo del vehículo</b> para calificar por un monto mayor.',
    order: [1,2,3,0],
    options: [
      { t: "Explicar que el avalúo lo determina un proceso independiente y no se puede modificar, y buscar alternativas dentro de lo que sí califica.", pts:{etica:25,servicio:5}, fb:"good", fbText:"Así se maneja: firmeza en el proceso, sin cerrarle la puerta al cliente." },
      { t: "Aceptar \"ayudar\" con el avalúo porque el cliente es de confianza.", pts:{etica:-30,resultados:15}, fb:"bad", fbText:"Esto es fraude en el avalúo. Riesgo legal grave para el cliente, para ti y para la empresa.", flag:true },
      { t: "Decirle que no y no ofrecer ninguna alternativa.", pts:{etica:10,servicio:-10}, fb:"mid", fbText:"Correcto en el fondo, pero dejaste al cliente sin ninguna opción real." },
      { t: "Sugerirle que hable con \"otro compañero que sea más flexible\".", pts:{etica:-20,equipo:-15}, fb:"bad", fbText:"Esto implica que hay prácticas irregulares en el equipo, lo cual es en sí mismo una falta grave.", flag:true },
    ],
  },
  {
    cat: "resultados",
    text: 'Vas al <b>40% de tu meta</b> con solo 5 días restantes del mes.',
    order: [0,3,1,2],
    options: [
      { t: "Priorizar tu cartera de prospectos avanzados y bloquear tiempo para cerrarlos.", pts:{resultados:20}, fb:"good", fbText:"Reacción correcta: un plan concreto con lo que ya tienes en cartera." },
      { t: "Pedir que se te acredite a tu cuota una venta de un compañero.", pts:{etica:-30,equipo:-25}, fb:"bad", fbText:"Falsificación de resultados y una falta grave de integridad con tu equipo.", flag:true },
      { t: "Aceptar que no llegarás a la meta, sin intentar nada distinto.", pts:{resultados:-20}, fb:"bad", fbText:"Resignación sin ningún intento de recuperar terreno en los días que quedan." },
      { t: "Presionar a clientes indecisos con una urgencia falsa (\"la promoción se acaba hoy\").", pts:{etica:-15,resultados:5}, fb:"bad", fbText:"Mentir al cliente genera riesgo reputacional, aun si cierra hoy.", flag:true },
    ],
  },
  {
    cat: "servicio",
    text: 'Un cliente molesto escribe por WhatsApp que <b>"nadie le responde"</b> y amenaza con quejarse en redes sociales.',
    order: [1,3,0,2],
    options: [
      { t: "Responder rápido, reconocer la demora y ofrecer una solución concreta con un tiempo definido.", pts:{servicio:20}, fb:"good", fbText:"Correcto: reconocimiento + solución concreta desactiva la mayoría de estas situaciones." },
      { t: "Responder a la defensiva, explicando por qué el retraso \"no fue tu culpa\".", pts:{servicio:-10}, fb:"bad", fbText:"Priorizaste justificarte sobre resolver el problema del cliente." },
      { t: "Ignorar el mensaje hasta que se calme.", pts:{servicio:-20}, fb:"bad", fbText:"Esto empeora la situación y aumenta el riesgo reputacional real." },
      { t: "Escalarlo de inmediato a tu gerente, sin intentar responder primero.", pts:{servicio:5}, fb:"mid", fbText:"Válido si es grave, pero primero conviene intentar una respuesta rápida tú mismo." },
    ],
  },
  {
    cat: "resultados",
    text: 'Un cliente con <b>buen historial de pago</b> está por terminar su préstamo en los próximos días.',
    order: [2,1,3,0],
    options: [
      { t: "Contactarlo antes del vencimiento para ofrecer una renovación o un nuevo producto ajustado a su perfil.", pts:{resultados:20,servicio:5}, fb:"good", fbText:"Correcto: la mejor oportunidad de venta suele estar en la cartera que ya conoces." },
      { t: "Esperar a que el cliente pregunte por su cuenta.", pts:{resultados:-10}, fb:"bad", fbText:"Postura pasiva frente a una oportunidad clara de renovación." },
      { t: "Ofrecerle un monto mucho mayor al que necesita, para aumentar tu comisión.", pts:{etica:-15,resultados:5}, fb:"bad", fbText:"Vender de más sin necesidad real del cliente es una práctica cuestionable, aunque suba tu comisión." },
      { t: "Enviar un mensaje genérico masivo, sin personalizar según su historial.", pts:{resultados:5}, fb:"mid", fbText:"Mejor que nada, pero pierde efectividad al no ser personalizado." },
    ],
  },
  {
    cat: "etica",
    text: 'Un cliente tiene la <b>cédula vencida</b> pero insiste en cerrar el préstamo hoy mismo.',
    order: [3,0,2,1],
    options: [
      { t: "Explicarle que el documento debe estar vigente por política, y ayudarlo a resolverlo lo antes posible sin perder el avance de su solicitud.", pts:{etica:20,cierre:5}, fb:"good", fbText:"Correcto: cumples la política y a la vez ayudas al cliente a avanzar." },
      { t: "Aceptar el documento vencido porque \"el cliente se ve confiable\".", pts:{etica:-25}, fb:"bad", fbText:"Esto viola un requisito de cumplimiento y expone a la empresa a un riesgo real.", flag:true },
      { t: "Decirle que no hay nada que hacer y cerrar la conversación.", pts:{etica:10,servicio:-10}, fb:"mid", fbText:"Correcto en el fondo, pero sin ayudar al cliente a resolver el problema." },
      { t: "Pedirle una copia informal y avanzar \"eso después se legaliza\".", pts:{etica:-20}, fb:"bad", fbText:"Avanzar con un proceso incompleto expone a la empresa a un riesgo de cumplimiento.", flag:true },
    ],
  },
  {
    cat: "etica",
    text: 'Al momento de firmar el pagaré, el cliente pregunta si puede firmar con una <b>fecha distinta a la real</b> "para arreglar algo con su banco".',
    order: [0,2,3,1],
    options: [
      { t: "Explicarle que el pagaré debe llevar la fecha real de la firma, sin excepciones.", pts:{etica:25}, fb:"good", fbText:"Correcto: un pagaré es un documento legal y su fecha no admite excepciones, sin importar el motivo del cliente." },
      { t: "Aceptar poner una fecha distinta porque \"no afecta a la empresa\".", pts:{etica:-30}, fb:"bad", fbText:"Alterar la fecha de un documento legal es fraude documental, así parezca un favor pequeño.", flag:true },
      { t: "Decirle que consulte con su banco después, y avanzar con la fecha real sin explicarle el motivo.", pts:{etica:10,servicio:-5}, fb:"mid", fbText:"Correcto en el fondo, pero el cliente se queda sin entender por qué no se puede — mejor explicarlo con claridad." },
      { t: "Sugerirle que hable con \"otro compañero para ver si él sí lo hace\".", pts:{etica:-20,equipo:-15}, fb:"bad", fbText:"Esto implica que hay prácticas irregulares en el equipo, lo cual es en sí mismo una falta grave.", flag:true },
    ],
  },
  {
    cat: "equipo",
    text: 'Un compañero te pide que le <b>"cuadres" un dato en el sistema</b> para que una venta cuente en su cuota del mes.',
    order: [3,1,0,2],
    options: [
      { t: "Decirle que no puedes hacerlo y sugerirle que hable directamente con su gerente sobre la situación real.", pts:{etica:20,equipo:10}, fb:"good", fbText:"Correcto: mantienes la integridad de los reportes y le das una salida honesta a tu compañero." },
      { t: "Hacerlo \"solo esta vez\" porque es un compañero cercano.", pts:{etica:-25,equipo:-15}, fb:"bad", fbText:"Comprometes la integridad de los reportes de la empresa por presión social.", flag:true },
      { t: "Reportarlo de inmediato a Recursos Humanos, sin hablar primero con él.", pts:{equipo:5,etica:10}, fb:"mid", fbText:"Válido en casos graves o reincidentes, aunque conversar primero suele ser el paso inicial razonable." },
      { t: "Ignorar la petición sin decir nada.", pts:{equipo:-5}, fb:"mid", fbText:"No resuelve nada y deja la puerta abierta a que lo intente de nuevo, contigo o con otra persona." },
    ],
  },
  {
    type: "valuation",
    cat: "garantia",
    maxPoints: { garantia: 70 },
    guideText: "Valor guía para este modelo y año, con kilometraje promedio (~65,000 km) y buen estado general: <b>$9,000</b>.",
    cars: [
      { label:"Carro A", year:"2019", km:"42,000 km", trans:"Manual", cond:"Buen estado general, pintura sin daños visibles, llantas con desgaste leve, sin ruidos mecánicos.", range:[8200,9800], tone:"good", avaluoOptions:[10800, 7500, 9200] },
      { label:"Carro B", year:"2019", km:"128,000 km", trans:"Automático", cond:"Pintura con rayones visibles en las puertas, una llanta con desgaste alto, ruido leve en el motor al acelerar.", range:[6200,7600], tone:"worn", avaluoOptions:[8500, 6900, 5500] },
    ],
  },
];

const VALUATION_SCENARIO = DEFAULT_SCENARIOS[DEFAULT_SCENARIOS.length - 1];
let SCENARIOS = DEFAULT_SCENARIOS;

async function loadScenarios(){
  if(!APPS_SCRIPT_URL) return;
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?action=getQuestions&prueba=agente');
    const data = await res.json();
    if(Array.isArray(data) && data.length){
      SCENARIOS = data.map(q => ({ cat: q.cat, text: q.text, options: q.options }))
        .concat([VALUATION_SCENARIO]);
    }
  }catch(e){ /* sin conexión: se usan las preguntas de respaldo incluidas en este archivo */ }
}

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzdwD4mF2VHbnpIoQ7s6WYA-VlNva2siU9uk52Z-HsPECBhMG9e0JiDfWG8YaFrw-hrlw/exec";

// Enlace personalizado: ?v=A|B|C cambia el orden de las opciones (anti-copia),
// ?nombre= y ?sucursal= prellenan y bloquean esos campos si el link viene de ti.
const urlParams = new URLSearchParams(location.search);
const VARIANT_SHIFT = { A:0, B:1, C:2, D:3 }[(urlParams.get('v')||'A').toUpperCase()] || 0;
const PREFILL_NAME = urlParams.get('nombre') || '';
const PREFILL_BRANCH = urlParams.get('sucursal') || '';

function applyVariant(options){
  if(!VARIANT_SHIFT) return options;
  const n = options.length;
  const shift = VARIANT_SHIFT % n;
  return options.slice(shift).concat(options.slice(0, shift));
}

let carImages = { carroA: "", carroB: "" };
async function loadCarImages(){
  if(!APPS_SCRIPT_URL) return;
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?action=getImages');
    const data = await res.json();
    if(data && (data.carroA || data.carroB)) carImages = data;
  }catch(e){ /* sin conexión al backend: se usa la ilustración de respaldo */ }
}
function postResult(payload){
  if(!APPS_SCRIPT_URL) return;
  try{
    fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(()=>{});
  }catch(e){}
}

const STORAGE = { name:"", branch:"" };
let idx = 0, scores = {}, log = [], ethicsFlag = false, answered = false;
let scenarioStart = 0, responseTimes = [];
Object.keys(CATEGORIES).forEach(k => scores[k]=0);

function maxByCategory(){
  const max = {}; Object.keys(CATEGORIES).forEach(k=>max[k]=0);
  SCENARIOS.forEach(s=>{
    if(s.maxPoints){
      Object.entries(s.maxPoints).forEach(([k,v])=>{ max[k]=(max[k]||0)+v; });
      return;
    }
    const best = {};
    s.options.forEach(o=>{
      Object.entries(o.pts||{}).forEach(([k,v])=>{ if(!best[k]||v>best[k]) best[k]=v; });
    });
    Object.entries(best).forEach(([k,v])=>{ if(v>0) max[k]+=v; });
  });
  return max;
}

const card = document.getElementById('card');
const routeHeader = document.getElementById('routeHeader');
const stopsEl = document.getElementById('stops');
const routeFill = document.getElementById('routeFill');

function renderStart(){
  const nameField = PREFILL_NAME
    ? `<div class="field"><label>Nombre del agente</label><input type="text" id="inpName" value="${escAttr(PREFILL_NAME)}" readonly style="background:var(--paper2);color:var(--asphalt);"></div>`

    ? `<div class="field"><label>Sucursal</label><input type="text" id="inpBranch" value="${escAttr(PREFILL_BRANCH)}" readonly style="background:var(--paper2);color:var(--asphalt);"></div>`
    : `<div class="field"><label>Sucursal</label><input type="text" id="inpBranch" placeholder="Casa Matriz, Chorrera, La 24 de Diciembre, Chiriquí..."></div>`;

  card.innerHTML = `
    <div class="start">
      <div class="cat-label">Simulador de decisiones</div>
      <h2>Revisión de Ruta</h2>
      <p>9 situaciones reales del ciclo de venta completo — desde la negociación hasta la firma del contrato y pagaré — incluyendo un ejercicio de avalúo comparando dos vehículos. También mide el tiempo que toma cada decisión, como referencia de agilidad. Úsalo cada trimestre para revisar criterio y detectar áreas de coaching a tiempo.</p>
      ${PREFILL_NAME ? `<div class="prefill-note">📩 Este enlace fue preparado para ti — tu nombre ya está registrado.</div>` : ''}

function escAttr(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

function buildStops(){
  stopsEl.innerHTML = SCENARIOS.map((_,i)=>`<div class="stop" data-i="${i}">${i+1}</div>`).join('');
  updateRoute();
}
function updateRoute(){
  document.querySelectorAll('.stop').forEach((el,i)=>{
    el.classList.remove('done','active');
    if(i<idx) el.classList.add('done');
    if(i===idx) el.classList.add('active');
  });
  const pct = idx/(SCENARIOS.length-1)*100;
  routeFill.style.width = `calc(${pct}% )`;
}

let currentOptions = [];
let miniTimerInterval = null;

/* ===== Sonidos (generados por código, sin archivos externos) ===== */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playAlertBeep(){
  try{
    const ctx = getAudioCtx();
    [0, 0.18].forEach(t => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = 780;
      gain.gain.setValueAtTime(0.001, ctx.currentTime + t);
      gain.gain.linearRampToValueAtTime(0.13, ctx.currentTime + t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.16);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + t);
      osc.stop(ctx.currentTime + t + 0.18);
    });
  }catch(e){}
}
function playSuccessChime(){
  try{
    const ctx = getAudioCtx();
    [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t = ctx.currentTime + i * 0.11;
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.linearRampToValueAtTime(0.14, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.36);
    });
  }catch(e){}
}

/* ===== Globos de celebración ===== */
function launchBalloons(){
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden;';
  document.body.appendChild(container);
  for(let i=0;i<16;i++){
    const b = document.createElement('div');
    b.textContent = ['🎈','🎉'][Math.random()<0.75?0:1];
    const left = Math.random()*96;
    const delay = Math.random()*0.5;
    const duration = 2.6 + Math.random()*1.6;
    const size = 26 + Math.random()*22;
    b.style.cssText = `position:absolute;left:${left}%;bottom:-60px;font-size:${size}px;animation:balloonUp ${duration}s ease-in ${delay}s forwards;`;
    container.appendChild(b);
  }
  setTimeout(()=>container.remove(), 4600);
}

/* ===== Alerta visual al llegar a la meta ===== */
function showGoalAlert(){
  const track = document.querySelector('.mini-track');
  if(!track || !track.parentNode) return;
  if(track.parentNode.querySelector('.goal-alert')) return;
  const alertEl = document.createElement('div');
  alertEl.className = 'goal-alert';
  alertEl.textContent = '🚨 ¡Tiempo recomendado alcanzado! Intenta decidir un poco más rápido.';
  track.insertAdjacentElement('afterend', alertEl);
}

function startMiniTimer(durationSec){
  clearInterval(miniTimerInterval);
  const car = document.getElementById('miniCar');
  if(!car) return;
  car.style.transition = 'none';
  car.style.left = '0%';
  void car.offsetWidth;
  car.style.transition = 'left .3s linear';
  const startT = Date.now();
  let goalReached = false;
  miniTimerInterval = setInterval(() => {
    const elapsed = (Date.now() - startT) / 1000;
    const pct = Math.min(100, (elapsed / durationSec) * 100);
    car.style.left = pct + '%';
    if (pct >= 100){
      clearInterval(miniTimerInterval);
      if(!goalReached){
        goalReached = true;
        playAlertBeep();
        showGoalAlert();
      }
    }
  }, 150);
}

function renderScenario(){
  answered = false;
  scenarioStart = Date.now();
  updateRoute();
  const s = SCENARIOS[idx];

  if(s.type === 'valuation'){ renderValuation(s); return; }

  const ord = s.order || [0,1,2,3];
  currentOptions = applyVariant(ord.map(i => s.options[i]));

  card.innerHTML = `
    <div class="cat-label">${CATEGORIES[s.cat].label}</div>
    <div class="scenario-num">Situación ${idx+1} de ${SCENARIOS.length}</div>
    <div class="scenario-text">${s.text}</div>
    <div class="mini-track"><div class="mini-inner"><div class="mini-line"></div><div class="mini-car" id="miniCar">${carIcon('good')}</div></div><div class="mini-flag">🏁</div></div>
    <div class="options" id="opts">
      ${currentOptions.map((o,i)=>`<button class="opt" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}.</span><span>${o.t}</span></button>`).join('')}
    </div>
    <div class="feedback" id="fb"></div>
    <button class="continue-btn" id="contBtn">${idx===SCENARIOS.length-1? 'Ver resultados →':'Continuar →'}</button>
  `;
  startMiniTimer(18);
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = () => selectOption(parseInt(btn.dataset.i));
  });
  document.getElementById('contBtn').onclick = () => {
    idx++;
    if(idx>=SCENARIOS.length) renderResults();
    else renderScenario();
  };
}

function selectOption(i){
  if(answered) return;
  answered = true;
  clearInterval(miniTimerInterval);
  responseTimes.push((Date.now()-scenarioStart)/1000);
  const s = SCENARIOS[idx];
  const o = currentOptions[i];
  Object.entries(o.pts||{}).forEach(([k,v])=>{ scores[k]=(scores[k]||0)+v; });
  if(o.flag) ethicsFlag = true;
  log.push({
    pregunta: s.text.replace(/<[^>]*>/g,''),
    respuesta: o.t,
    resultado: o.fb,
    explicacion: o.fbText
  });

  document.querySelectorAll('.opt').forEach((btn,bi)=>{
    btn.style.pointerEvents='none';
    if(bi===i){
      btn.style.borderColor = o.fb==='good'?'#3FA34D': o.fb==='bad'?'#D6534A':'#1F7A6C';
      btn.style.borderWidth = '2px';
      btn.style.background = '#fff';
    } else { btn.style.opacity = .5; }
  });
  const fb = document.getElementById('fb');
  fb.className = 'feedback ' + o.fb;
  const label = o.fb==='good' ? 'Buena decisión' : o.fb==='bad' ? 'Decisión riesgosa' : 'Decisión aceptable';
  fb.innerHTML = `<strong>${label}</strong>${o.fbText}`;
  fb.style.display='block';
  document.getElementById('contBtn').style.display='inline-block';
}

  const window_ = tone === 'good' ? '#DCEFEA' : '#DCD8CE';

    <ellipse cx="120" cy="103" rx="95" ry="7" fill="rgba(20,33,61,0.10)"/>
    <path d="M20,95 L20,72 C20,58 33,47 52,47 L84,47 L100,23 L148,23 L164,47 L192,47 C207,47 220,60 220,75 L220,95 Z" fill="${body}" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
    <path d="M92,45 L103,26 L145,26 L156,45 Z" fill="${window_}"/>
    <line x1="140" y1="47" x2="140" y2="95" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>

function carPhotoHTML(ci, c){
  const url = ci===0 ? carImages.carroA : carImages.carroB;
  if(url){
    return `<img src="${url}" alt="${c.label}">`;
  }
  return `<img src="${ci===0?'carro-a.jpg':'carro-b.jpg'}" alt="${c.label}" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><div class="val-fallback" style="display:none;">${carIcon(c.tone)}</div>`;
}

let valuationSelection = {};

function renderValuation(s){
  valuationSelection = {};
  card.innerHTML = `
    <div class="cat-label">${CATEGORIES[s.cat].label}</div>
    <div class="scenario-num">Situación ${idx+1} de ${SCENARIOS.length}</div>
    <div class="scenario-text" style="font-size:17px;">Compara los dos vehículos y elige el avalúo que darías a cada uno. El monto que calificaría (30%) se calcula automáticamente.</div>
    <div class="mini-track"><div class="mini-inner"><div class="mini-line"></div><div class="mini-car" id="miniCar">${carIcon('good')}</div></div><div class="mini-flag">🏁</div></div>
    <div style="font-size:13.5px;color:var(--asphalt);background:var(--paper);border:1px dashed var(--line);border-radius:6px;padding:10px 12px;margin-bottom:18px;">${s.guideText}</div>
    <div class="val-grid">
      ${s.cars.map((c,ci)=>`
        <div class="val-card">
          <div class="val-photo">
            ${carPhotoHTML(ci,c)}
          </div>
          <div class="val-title">${c.label} · ${c.year}</div>
          <div class="val-specs">
            <span>🛣️ ${c.km}</span>
            <span>⚙️ ${c.trans}</span>
          </div>
          <div class="val-cond">${c.cond}</div>
          <div class="val-field">
            <label>Tu avalúo</label>
            <div class="val-choices" id="choices${ci}">
              ${c.avaluoOptions.map((amt,oi)=>`<button type="button" class="val-choice" data-car="${ci}" data-amt="${amt}">$${amt.toLocaleString()}</button>`).join('')}
            </div>
          </div>
          <div class="val-field">
            <label>Monto que calificaría — 30%</label>
            <div class="val-computed" id="computed${ci}">—</div>
          </div>
        </div>
      `).join('')}
    </div>
    <button class="continue-btn" id="verifyBtn" style="display:inline-block;">Verificar avalúo →</button>
    <div class="feedback" id="fb"></div>
    <button class="continue-btn" id="contBtn">${idx===SCENARIOS.length-1? 'Ver resultados →':'Continuar →'}</button>
  `;
  document.querySelectorAll('.val-choice').forEach(btn=>{
    btn.onclick = () => {
      const ci = btn.dataset.car;
      const amt = parseFloat(btn.dataset.amt);
      valuationSelection[ci] = amt;
      document.querySelectorAll(`.val-choice[data-car="${ci}"]`).forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('computed'+ci).textContent = '$' + Math.round(amt*0.3).toLocaleString();
    };
  });
  document.getElementById('verifyBtn').onclick = () => verifyValuation(s);
  document.getElementById('contBtn').onclick = () => {
    idx++;
    if(idx>=SCENARIOS.length) renderResults();
    else renderScenario();
  };
  startMiniTimer(45);
}

function verifyValuation(s){
  if(answered) return;
  if(valuationSelection['0']==null || valuationSelection['1']==null){
    const fb = document.getElementById('fb');
    fb.className = 'feedback mid';
    fb.innerHTML = `<strong>Falta un avalúo</strong>Elige un monto para los dos vehículos antes de verificar.`;
    fb.style.display='block';
    return;
  }
  answered = true;
  clearInterval(miniTimerInterval);
  responseTimes.push((Date.now()-scenarioStart)/1000);
  const av = [valuationSelection['0'], valuationSelection['1']];
  const fin = av.map(a => Math.round(a*0.3));

  const inRangeA = av[0] >= s.cars[0].range[0] && av[0] <= s.cars[0].range[1];
  const inRangeB = av[1] >= s.cars[1].range[0] && av[1] <= s.cars[1].range[1];
  const orderOk = av[0] > av[1];

  let earned = 0;
  if(inRangeA) earned += 30;
  if(inRangeB) earned += 30;
  if(orderOk) earned += 10;
  scores.garantia = (scores.garantia||0) + earned;

  const passCount = [inRangeA,inRangeB,orderOk].filter(Boolean).length;
  let fbClass = passCount>=3 ? 'good' : passCount>=1 ? 'mid' : 'bad';
  let label = fbClass==='good' ? 'Buen criterio de avalúo' : fbClass==='mid' ? 'Criterio parcial' : 'Necesita reforzar avalúo';

  log.push({
    pregunta: 'Análisis de garantía: avalúo de dos vehículos',
    respuesta: `Carro A: $${av[0].toLocaleString()} (financia $${fin[0].toLocaleString()}) · Carro B: $${av[1].toLocaleString()} (financia $${fin[1].toLocaleString()})`,
    resultado: fbClass,
    explicacion: `${passCount}/3 criterios correctos (avalúo A realista, avalúo B realista, orden lógico A>B).`
  });

  const checklist = `
    <div style="margin-top:8px;font-size:13.5px;line-height:1.7;">
      <div>${inRangeA?'✅':'❌'} Avalúo Carro A realista ($${s.cars[0].range[0].toLocaleString()}–$${s.cars[0].range[1].toLocaleString()}). Elegiste: $${av[0].toLocaleString()}</div>
      <div>${inRangeB?'✅':'❌'} Avalúo Carro B realista ($${s.cars[1].range[0].toLocaleString()}–$${s.cars[1].range[1].toLocaleString()}). Elegiste: $${av[1].toLocaleString()}</div>
      <div>${orderOk?'✅':'❌'} Carro A (mejor estado, menos km) valuado por encima de Carro B</div>
    </div>`;

  document.getElementById('verifyBtn').style.display='none';
  document.querySelectorAll('.val-choice').forEach(btn=>btn.disabled=true);
  const fb = document.getElementById('fb');
  fb.className = 'feedback ' + fbClass;
  fb.innerHTML = `<strong>${label}</strong>${checklist}`;
  fb.style.display='block';
  document.getElementById('contBtn').style.display='inline-block';
}

function renderResults(){
  routeHeader.style.display='none';
  const max = maxByCategory();
  const pct = {};
  Object.keys(CATEGORIES).forEach(k=>{
    pct[k] = max[k]>0 ? Math.max(0, Math.min(100, Math.round((scores[k]/max[k])*100))) : 0;
  });
  const overall = Math.round(Object.values(pct).reduce((a,b)=>a+b,0)/Object.keys(pct).length);

  let verdictTitle;
  if(ethicsFlag){ verdictTitle = '🚩 Requiere conversación directa con el agente'; }
  else if(overall>=75){ verdictTitle = '✅ Desempeño sólido'; }
  else if(overall>=50){ verdictTitle = '🟡 Desempeño aceptable, con áreas a reforzar'; }
  else { verdictTitle = '🔴 Necesita acompañamiento inmediato'; }

  const sorted = Object.entries(pct).sort((a,b)=>a[1]-b[1]);
  const weakest = sorted[0];
  const avgTime = responseTimes.length ? responseTimes.reduce((a,b)=>a+b,0)/responseTimes.length : null;

  postResult({
    action: 'submitResult',
    test: 'agente',
    name: STORAGE.name,
    branch: STORAGE.branch,
    overall: overall,
    verdictTitle: verdictTitle,
    categories: pct,
    weakest: CATEGORIES[weakest[0]].label,
    ethicsFlag: ethicsFlag,
    avgResponseTime: avgTime != null ? Number(avgTime.toFixed(1)) : '',
    answers: log
  });

  card.innerHTML = `
    <div class="results">
      <div class="cat-label">Evaluación completada</div>
      <h2>Gracias, ${STORAGE.name}</h2>
      <div class="sub">Sucursal: ${STORAGE.branch}</div>
      <div class="verdict v-mid"><strong>Tus respuestas fueron registradas</strong>Tu gerente revisará los resultados de esta revisión periódica y te dará seguimiento si corresponde.</div>
      <div class="actions">
        <button class="primary" onclick="location.reload()">Finalizar</button>
      </div>
    </div>
  `;
  playSuccessChime();
  launchBalloons();
}

async function init(){
  card.innerHTML = `<div style="text-align:center;padding:60px 0;color:var(--asphalt);">Cargando prueba…</div>`;
  await loadScenarios();
  loadCarImages();
  renderStart();
}
init();
</script>
