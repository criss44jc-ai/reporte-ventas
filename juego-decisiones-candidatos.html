<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Ruta del Vendedor — Financiera Autocash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14213D;
    --asphalt:#3A3F44;
    --paper:#F1EFE9;
    --paper2:#E8E5DC;
    --amber:#F4A11B;
    --amber-dark:#C97F0E;
    --green:#3FA34D;
    --red:#D6534A;
    --line:#D2CDC0;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      repeating-linear-gradient(90deg, transparent 0 78px, rgba(20,33,61,0.035) 78px 80px);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 60px;}

  /* ROUTE HEADER */
  .brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:6px;}
  .brand h1{font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin:0;color:var(--asphalt);}
  .brand .tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--amber-dark);background:#FBEBD3;padding:3px 8px;border-radius:3px;}

  .route{position:relative;padding:26px 6px 10px;margin-bottom:8px;}
  .route-line{position:absolute;top:38px;left:20px;right:20px;height:3px;background:repeating-linear-gradient(90deg,var(--asphalt) 0 10px, transparent 10px 18px);border-radius:2px;}
  .route-fill{position:absolute;top:38px;left:20px;height:3px;background:var(--amber);border-radius:2px;transition:width .5s ease;z-index:1;}
  .stops{position:relative;display:flex;justify-content:space-between;z-index:2;}
  .stop{width:26px;height:26px;border-radius:50%;background:var(--white);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--asphalt);transition:all .3s ease;}
  .stop.done{background:var(--amber);border-color:var(--amber-dark);color:var(--ink);}
  .stop.active{border-color:var(--ink);color:var(--ink);transform:scale(1.15);}

  /* CARD */
  .card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:30px 28px;box-shadow:0 2px 0 var(--line);}
  .cat-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber-dark);margin-bottom:10px;}
  .scenario-num{font-family:'Oswald',sans-serif;font-size:13px;color:var(--asphalt);opacity:.6;margin-bottom:4px;}
  .scenario-text{font-size:19px;line-height:1.5;margin:6px 0 26px;font-weight:500;color:var(--ink);}
  .scenario-text b{color:var(--ink);}

  .mini-track{position:relative;height:32px;margin:-8px 0 22px;}
  .mini-inner{position:absolute;top:0;left:0;right:28px;bottom:0;}
  .mini-line{position:absolute;top:50%;left:0;right:0;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 7px, transparent 7px 13px);transform:translateY(-50%);}
  .mini-car{position:absolute;top:50%;left:0%;transform:translate(-50%,-55%);transition:left .3s linear;width:30px;}
  .mini-car svg{width:30px;display:block;}
  .mini-flag{position:absolute;top:50%;right:-2px;transform:translateY(-50%);font-size:17px;}

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    text-align:left;
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:14px 16px;
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
    transition:all .15s ease;
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .opt:hover{border-color:var(--ink);background:var(--white);transform:translateX(2px);}
  .opt .letter{font-family:'Oswald',sans-serif;font-weight:700;color:var(--amber-dark);flex-shrink:0;}

  .feedback{margin-top:20px;padding:16px 18px;border-radius:8px;font-size:14.5px;line-height:1.5;display:none;}
  .feedback.good{background:#E9F6EA;border:1.5px solid var(--green);color:#1F6B2C;}
  .feedback.mid{background:#FDF3E3;border:1.5px solid var(--amber-dark);color:#8A5A0A;}
  .feedback.bad{background:#FBEAE8;border:1.5px solid var(--red);color:#A6362D;}
  .feedback strong{display:block;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}

  .continue-btn{margin-top:18px;background:var(--ink);color:var(--white);border:none;border-radius:6px;padding:12px 22px;font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;display:none;}
  .continue-btn:hover{background:#0C1730;}

  /* START SCREEN */
  .start h2{font-family:'Oswald',sans-serif;font-size:30px;margin:0 0 10px;line-height:1.15;}
  .start p{font-size:15.5px;color:var(--asphalt);line-height:1.6;margin-bottom:20px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--asphalt);margin-bottom:5px;}
  .field input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:6px;font-family:'Inter';font-size:15px;background:var(--paper);}
  .field input:focus{outline:2px solid var(--ink);border-color:var(--ink);}
  .start-btn{margin-top:8px;width:100%;background:var(--amber);color:var(--ink);border:none;border-radius:6px;padding:14px;font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;cursor:pointer;}
  .start-btn:hover{background:var(--amber-dark);color:var(--white);}
  .start-btn:disabled{opacity:.45;cursor:not-allowed;}

  /* RESULTS */
  .results h2{font-family:'Oswald',sans-serif;font-size:26px;margin:0 0 4px;}
  .results .sub{color:var(--asphalt);font-size:14px;margin-bottom:22px;}
  .verdict{padding:18px 20px;border-radius:8px;margin-bottom:26px;font-size:16px;line-height:1.5;}
  .verdict.v-good{background:#E9F6EA;border:1.5px solid var(--green);}
  .verdict.v-mid{background:#FDF3E3;border:1.5px solid var(--amber-dark);}
  .verdict.v-bad{background:#FBEAE8;border:1.5px solid var(--red);}
  .verdict strong{display:block;font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;}

  .bar-row{margin-bottom:16px;}
  .bar-top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px;}
  .bar-top .name{font-weight:600;}
  .bar-top .val{font-family:'JetBrains Mono',monospace;font-weight:700;}
  .bar-bg{height:14px;background:var(--paper2);border-radius:7px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:7px;transition:width .8s ease;}

  .reforzar{margin-top:26px;padding:16px 18px;background:var(--paper);border:1px dashed var(--asphalt);border-radius:8px;font-size:14px;color:var(--asphalt);}
  .reforzar b{color:var(--ink);}

  /* VALUATION SCENARIO */
  .val-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
  @media (max-width:640px){ .val-grid{grid-template-columns:1fr;} }
  .val-card{border:1.5px solid var(--line);border-radius:8px;padding:14px;background:var(--paper);}
  .val-photo{background:var(--white);border-radius:6px;overflow:hidden;margin-bottom:10px;border:1px solid var(--line);}
  .val-photo img{width:100%;display:block;}
  .val-fallback svg{width:100%;display:block;}
  .val-title{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;margin-bottom:6px;}
  .val-specs{display:flex;gap:12px;font-size:13px;color:var(--asphalt);margin-bottom:8px;}
  .val-cond{font-size:12.5px;color:var(--asphalt);line-height:1.5;margin-bottom:12px;min-height:52px;}
  .val-field{margin-bottom:8px;}
  .val-field label{display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--asphalt);margin-bottom:4px;}
  .val-field input{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:14px;background:var(--white);}
  .val-field input:focus{outline:2px solid var(--ink);border-color:var(--ink);}
  .val-field input:disabled{background:var(--paper2);color:var(--asphalt);}

  .actions{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap;}
  .actions button{flex:1;min-width:150px;padding:12px;border-radius:6px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;border:1.5px solid var(--ink);background:var(--white);color:var(--ink);}
  .actions button.primary{background:var(--ink);color:var(--white);}
  .actions button:hover{opacity:.85;}

  @media print{
    body{background:white;}
    .route,.actions{display:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>Financiera Autocash</h1>
    <span class="tag" id="brandTag">Selección de personal</span>
  </div>

  <div class="route" id="routeHeader" style="display:none;">
    <div class="route-line"></div>

  </div>

  <div class="card" id="card"></div>
</div>

const VALUATION_SCENARIO = DEFAULT_SCENARIOS[DEFAULT_SCENARIOS.length - 1];
let SCENARIOS = DEFAULT_SCENARIOS;

async function loadScenarios(){
  if(!APPS_SCRIPT_URL) return;
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?action=getQuestions&prueba=candidato');
    const data = await res.json();
    if(Array.isArray(data) && data.length){
      SCENARIOS = data.map(q => ({ cat: q.cat, text: q.text, options: q.options }))
        .concat([VALUATION_SCENARIO]);
    }
  }catch(e){ /* sin conexión: se usan las preguntas de respaldo incluidas en este archivo */ }
}

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxmLRCd9SwtPX8gYjLUs3W9rBRVS-Ui4_rGDD8Yb7GBlb6tWlH5sfLPgHZaky8vrpWgEQ/exec";

let carImages = { carroA: "", carroB: "" };
async function loadCarImages(){
  if(!APPS_SCRIPT_URL) return;
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?action=getImages');
    const data = await res.json();
    if(data && (data.carroA || data.carroB)) carImages = data;
  }catch(e){ /* sin conexión al backend: se usa la ilustración de respaldo */ }
}
function postResult(payload){
  if(!APPS_SCRIPT_URL) return;
  try{
    fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(()=>{});
  }catch(e){}
}

const STORAGE = { name:"", branch:"" };
let idx = 0, scores = {}, log = [], ethicsFlag = false, answered = false;
Object.keys(CATEGORIES).forEach(k => scores[k]=0);

function maxByCategory(){
  const max = {}; Object.keys(CATEGORIES).forEach(k=>max[k]=0);
  SCENARIOS.forEach(s=>{
    if(s.maxPoints){
      Object.entries(s.maxPoints).forEach(([k,v])=>{ max[k]=(max[k]||0)+v; });
      return;
    }
    const best = {};
    s.options.forEach(o=>{
      Object.entries(o.pts||{}).forEach(([k,v])=>{ if(!best[k]||v>best[k]) best[k]=v; });
    });
    Object.entries(best).forEach(([k,v])=>{ if(v>0) max[k]+=v; });
  });
  return max;
}

const card = document.getElementById('card');
const routeHeader = document.getElementById('routeHeader');
const stopsEl = document.getElementById('stops');
const routeFill = document.getElementById('routeFill');

function renderStart(){
  card.innerHTML = `
    <div class="start">
      <div class="cat-label">Simulador de decisiones</div>
      <h2>La Ruta del Vendedor</h2>
      <p>9 situaciones reales del día a día de un vendedor de préstamos con garantía vehicular, incluyendo un ejercicio de avalúo comparando dos vehículos. Cada decisión que tomes suma o resta puntos en 6 áreas clave. Al final verás un perfil completo del candidato.</p>
      <div class="field">
        <label>Nombre del candidato</label>
        <input type="text" id="inpName" placeholder="Nombre completo">
      </div>
      <div class="field">
        <label>Sucursal a la que aplica</label>
        <input type="text" id="inpBranch" placeholder="Casa Matriz, Chorrera, La 24 de Diciembre, Chiriquí...">
      </div>
      <button class="start-btn" id="startBtn">Comenzar la ruta →</button>
    </div>`;
  document.getElementById('startBtn').onclick = () => {
    STORAGE.name = document.getElementById('inpName').value.trim() || "Candidato sin nombre";
    STORAGE.branch = document.getElementById('inpBranch').value.trim() || "—";
    routeHeader.style.display='block';
    buildStops();
    renderScenario();
  };
}

function buildStops(){
  stopsEl.innerHTML = SCENARIOS.map((_,i)=>`<div class="stop" data-i="${i}">${i+1}</div>`).join('');
  updateRoute();
}
function updateRoute(){
  document.querySelectorAll('.stop').forEach((el,i)=>{
    el.classList.remove('done','active');
    if(i<idx) el.classList.add('done');
    if(i===idx) el.classList.add('active');
  });
  const pct = idx/(SCENARIOS.length-1)*100;
  routeFill.style.width = `calc(${pct}% )`;
}

let currentOptions = [];
let miniTimerInterval = null;

function startMiniTimer(durationSec){
  clearInterval(miniTimerInterval);
  const car = document.getElementById('miniCar');
  if(!car) return;
  car.style.transition = 'none';
  car.style.left = '0%';
  void car.offsetWidth;
  car.style.transition = 'left .3s linear';
  const startT = Date.now();
  miniTimerInterval = setInterval(() => {
    const elapsed = (Date.now() - startT) / 1000;
    const pct = Math.min(100, (elapsed / durationSec) * 100);
    car.style.left = pct + '%';
    if (pct >= 100) clearInterval(miniTimerInterval);
  }, 150);
}

function renderScenario(){
  answered = false;
  updateRoute();
  const s = SCENARIOS[idx];

  if(s.type === 'valuation'){ renderValuation(s); return; }

  const ord = s.order || [0,1,2,3];
  currentOptions = ord.map(i => s.options[i]);

  card.innerHTML = `
    <div class="cat-label">${CATEGORIES[s.cat].label}</div>
    <div class="scenario-num">Situación ${idx+1} de ${SCENARIOS.length}</div>
    <div class="scenario-text">${s.text}</div>
    <div class="mini-track"><div class="mini-inner"><div class="mini-line"></div><div class="mini-car" id="miniCar">${carIcon('good')}</div></div><div class="mini-flag">🏁</div></div>
    <div class="options" id="opts">
      ${currentOptions.map((o,i)=>`<button class="opt" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}.</span><span>${o.t}</span></button>`).join('')}
    </div>
    <div class="feedback" id="fb"></div>
    <button class="continue-btn" id="contBtn">${idx===SCENARIOS.length-1? 'Ver resultados →':'Continuar →'}</button>
  `;
  startMiniTimer(18);
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = () => selectOption(parseInt(btn.dataset.i));
  });
  document.getElementById('contBtn').onclick = () => {
    idx++;
    if(idx>=SCENARIOS.length) renderResults();
    else renderScenario();
  };
}

function selectOption(i){
  if(answered) return;
  answered = true;
  clearInterval(miniTimerInterval);
  const s = SCENARIOS[idx];
  const o = currentOptions[i];
  Object.entries(o.pts||{}).forEach(([k,v])=>{ scores[k]=(scores[k]||0)+v; });
  if(o.flag) ethicsFlag = true;
  log.push({
    pregunta: s.text.replace(/<[^>]*>/g,''),
    respuesta: o.t,
    resultado: o.fb,
    explicacion: o.fbText
  });

  document.querySelectorAll('.opt').forEach((btn,bi)=>{
    btn.style.pointerEvents='none';
    if(bi===i){
      btn.style.borderColor = o.fb==='good'?'#3FA34D': o.fb==='bad'?'#D6534A':'#F4A11B';
      btn.style.borderWidth = '2px';
      btn.style.background = '#fff';
    } else { btn.style.opacity = .5; }
  });
  const fb = document.getElementById('fb');
  fb.className = 'feedback ' + o.fb;
  const label = o.fb==='good' ? 'Buena decisión' : o.fb==='bad' ? 'Decisión riesgosa' : 'Decisión aceptable';
  fb.innerHTML = `<strong>${label}</strong>${o.fbText}`;
  fb.style.display='block';
  document.getElementById('contBtn').style.display='inline-block';
}

function carIcon(tone){
  const body = tone === 'good' ? '#3A6EA5' : '#8A8378';
  const window_ = tone === 'good' ? '#DCE8F5' : '#DCD8CE';
  return `<svg viewBox="0 0 240 120" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="120" cy="103" rx="95" ry="7" fill="rgba(20,33,61,0.10)"/>
    <path d="M20,95 L20,72 C20,58 33,47 52,47 L84,47 L100,23 L148,23 L164,47 L192,47 C207,47 220,60 220,75 L220,95 Z" fill="${body}" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
    <path d="M92,45 L103,26 L145,26 L156,45 Z" fill="${window_}"/>
    <line x1="140" y1="47" x2="140" y2="95" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
    <circle cx="70" cy="96" r="17" fill="#22262B"/><circle cx="70" cy="96" r="6.5" fill="#C9C9C9"/>
    <circle cx="172" cy="96" r="17" fill="#22262B"/><circle cx="172" cy="96" r="6.5" fill="#C9C9C9"/>
    ${tone!=='good' ? '<line x1="55" y1="60" x2="80" y2="72" stroke="rgba(0,0,0,0.25)" stroke-width="2"/><line x1="150" y1="58" x2="175" y2="70" stroke="rgba(0,0,0,0.2)" stroke-width="2"/>' : ''}
  </svg>`;
}

function carPhotoHTML(ci, c){
  const url = ci===0 ? carImages.carroA : carImages.carroB;
  if(url){
    return `<img src="${url}" alt="${c.label}">`;
  }
  return `<img src="${ci===0?'carro-a.jpg':'carro-b.jpg'}" alt="${c.label}" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><div class="val-fallback" style="display:none;">${carIcon(c.tone)}</div>`;
}

function renderValuation(s){
  card.innerHTML = `
    <div class="cat-label">${CATEGORIES[s.cat].label}</div>
    <div class="scenario-num">Situación ${idx+1} de ${SCENARIOS.length}</div>
    <div class="scenario-text" style="font-size:17px;">Compara los dos vehículos y da tu avalúo real para cada uno. Con ese avalúo, indica a cuánto calificaría el cliente (financiamos hasta el 30% del avalúo).</div>
    <div class="mini-track"><div class="mini-inner"><div class="mini-line"></div><div class="mini-car" id="miniCar">${carIcon('good')}</div></div><div class="mini-flag">🏁</div></div>
    <div style="font-size:13.5px;color:var(--asphalt);background:var(--paper);border:1px dashed var(--line);border-radius:6px;padding:10px 12px;margin-bottom:18px;">${s.guideText}</div>
    <div class="val-grid">
      ${s.cars.map((c,ci)=>`
        <div class="val-card">
          <div class="val-photo">
            ${carPhotoHTML(ci,c)}
          </div>
          <div class="val-title">${c.label} · ${c.year}</div>
          <div class="val-specs">
            <span>🛣️ ${c.km}</span>
            <span>⚙️ ${c.trans}</span>
          </div>
          <div class="val-cond">${c.cond}</div>
          <div class="val-field">
            <label>Tu avalúo ($)</label>
            <input type="number" id="av${ci}" placeholder="0" min="0">
          </div>
          <div class="val-field">
            <label>Monto que calificaría — 30% (${'$'})</label>
            <input type="number" id="fin${ci}" placeholder="0" min="0">
          </div>
        </div>
      `).join('')}
    </div>
    <button class="continue-btn" id="verifyBtn" style="display:inline-block;">Verificar avalúo →</button>
    <div class="feedback" id="fb"></div>
    <button class="continue-btn" id="contBtn">${idx===SCENARIOS.length-1? 'Ver resultados →':'Continuar →'}</button>
  `;
  document.getElementById('verifyBtn').onclick = () => verifyValuation(s);
  document.getElementById('contBtn').onclick = () => {
    idx++;
    if(idx>=SCENARIOS.length) renderResults();
    else renderScenario();
  };
  startMiniTimer(60);
}

function verifyValuation(s){
  if(answered) return;
  answered = true;
  clearInterval(miniTimerInterval);
  const av = [parseFloat(document.getElementById('av0').value)||0, parseFloat(document.getElementById('av1').value)||0];
  const fin = [parseFloat(document.getElementById('fin0').value)||0, parseFloat(document.getElementById('fin1').value)||0];

  const inRangeA = av[0] >= s.cars[0].range[0] && av[0] <= s.cars[0].range[1];
  const inRangeB = av[1] >= s.cars[1].range[0] && av[1] <= s.cars[1].range[1];
  const orderOk = av[0] > av[1];
  const mathA = Math.abs(fin[0] - av[0]*0.3) <= 30;
  const mathB = Math.abs(fin[1] - av[1]*0.3) <= 30;

  let earned = 0;
  if(inRangeA) earned += 15;
  if(inRangeB) earned += 15;
  if(orderOk) earned += 10;
  if(mathA) earned += 15;
  if(mathB) earned += 15;
  scores.garantia = (scores.garantia||0) + earned;

  const passCount = [inRangeA,inRangeB,orderOk,mathA,mathB].filter(Boolean).length;
  let fbClass = passCount>=4 ? 'good' : passCount>=2 ? 'mid' : 'bad';
  let label = fbClass==='good' ? 'Buen criterio de avalúo' : fbClass==='mid' ? 'Criterio parcial' : 'Necesita reforzar avalúo';

  log.push({
    pregunta: 'Análisis de garantía: avalúo de dos vehículos',
    respuesta: `Carro A: $${av[0].toLocaleString()} (financia $${fin[0].toLocaleString()}) · Carro B: $${av[1].toLocaleString()} (financia $${fin[1].toLocaleString()})`,
    resultado: fbClass,
    explicacion: `${passCount}/5 criterios correctos (rango A, rango B, orden lógico, cálculo 30% A, cálculo 30% B).`
  });

  const checklist = `
    <div style="margin-top:8px;font-size:13.5px;line-height:1.7;">
      <div>${inRangeA?'✅':'❌'} Avalúo Carro A dentro de rango realista ($${s.cars[0].range[0].toLocaleString()}–$${s.cars[0].range[1].toLocaleString()}). Ingresado: $${av[0].toLocaleString()}</div>
      <div>${inRangeB?'✅':'❌'} Avalúo Carro B dentro de rango realista ($${s.cars[1].range[0].toLocaleString()}–$${s.cars[1].range[1].toLocaleString()}). Ingresado: $${av[1].toLocaleString()}</div>
      <div>${orderOk?'✅':'❌'} Carro A (mejor estado, menos km) valuado por encima de Carro B</div>
      <div>${mathA?'✅':'❌'} Cálculo del 30% correcto para Carro A (esperado ≈ $${Math.round(av[0]*0.3).toLocaleString()})</div>
      <div>${mathB?'✅':'❌'} Cálculo del 30% correcto para Carro B (esperado ≈ $${Math.round(av[1]*0.3).toLocaleString()})</div>
    </div>`;

  document.getElementById('verifyBtn').style.display='none';
  document.querySelectorAll('.val-field input').forEach(inp=>inp.disabled=true);
  const fb = document.getElementById('fb');
  fb.className = 'feedback ' + fbClass;
  fb.innerHTML = `<strong>${label}</strong>${checklist}`;
  fb.style.display='block';
  document.getElementById('contBtn').style.display='inline-block';
}

function renderResults(){
  routeHeader.style.display='none';
  const max = maxByCategory();
  const pct = {};
  Object.keys(CATEGORIES).forEach(k=>{
    pct[k] = max[k]>0 ? Math.max(0, Math.min(100, Math.round((scores[k]/max[k])*100))) : 0;
  });
  const overall = Math.round(Object.values(pct).reduce((a,b)=>a+b,0)/Object.keys(pct).length);

  let verdictTitle;
  if(ethicsFlag){ verdictTitle = '🚩 Requiere conversación adicional'; }
  else if(overall>=75){ verdictTitle = '✅ Recomendado para contratar'; }
  else if(overall>=50){ verdictTitle = '🟡 Recomendado con reservas'; }
  else { verdictTitle = '🔴 No recomendado en este momento'; }

  const sorted = Object.entries(pct).sort((a,b)=>a[1]-b[1]);
  const weakest = sorted[0];

  postResult({
    action: 'submitResult',
    test: 'candidato',
    name: STORAGE.name,
    branch: STORAGE.branch,
    overall: overall,
    verdictTitle: verdictTitle,
    categories: pct,
    weakest: CATEGORIES[weakest[0]].label,
    ethicsFlag: ethicsFlag,
    answers: log
  });

  card.innerHTML = `
    <div class="results">
      <div class="cat-label">Evaluación completada</div>
      <h2>¡Gracias, ${STORAGE.name}!</h2>
      <div class="sub">Sucursal: ${STORAGE.branch}</div>
      <div class="verdict v-mid"><strong>Tus respuestas fueron registradas</strong>El equipo de selección de Financiera Autocash revisará tus resultados. Si tu perfil avanza en el proceso, te contactaremos pronto.</div>
      <div class="actions">
        <button class="primary" onclick="location.reload()">Finalizar</button>
      </div>
    </div>
  `;
}

async function init(){
  card.innerHTML = `<div style="text-align:center;padding:60px 0;color:var(--asphalt);">Cargando prueba…</div>`;
  await loadScenarios();
  loadCarImages();
  renderStart();
}
init();
</script>
</body>
</html>
